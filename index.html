<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação de Aniversário</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f3f3; /* Cor de fundo suave */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.5;
        }
        /* Estilo do novo botão de link */
        .botao-confirmar {
            display: inline-block;
            width: 100%;
            padding: 15px;
            background-color: #ff6b6b; /* Cor do botão (salmão/vermelho claro) */
            color: white;
            text-decoration: none; /* Tira o sublinhado do link */
            font-weight: bold;
            font-size: 18px;
            border-radius: 8px;
            box-sizing: border-box;
            transition: background-color 0.3s, transform 0.2s;
        }
        .botao-confirmar:hover {
            background-color: #ff4757; /* Cor do botão ao passar o mouse */
            transform: scale(1.02); /* Dá uma leve aumentada no botão ao passar o mouse */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Você está convidado! 🎈</h1>
        <p>Vou comemorar meu aniversário e sua presença é muito importante para mim! <br><br> Por favor, clique no botão abaixo para confirmar se você poderá ir.</p>
        
        <!-- COLOQUE O LINK DO SEU GOOGLE FORMS AQUI NO LUGAR DO "LINK_DO_SEU_FORMULARIO_AQUI" -->
        <a href="https://form.respondi.app/VrL1fo0w" target="_blank" class="botao-confirmar">
            Ir para o Formulário de Confirmação
        </a>

    </div>

</body>
</html>
