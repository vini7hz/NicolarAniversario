<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Festa do Ano - 18TÃO</title>
    
    <!-- Importando fontes para dar cara de cartaz de festa/balada -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #050505; /* Fundo bem escuro */
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background: rgba(15, 15, 15, 0.9);
            padding: 50px 30px;
            border-radius: 12px;
            border: 2px solid #ff0055; /* Borda rosa choque/neon */
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4), inset 0 0 15px rgba(255, 0, 85, 0.2);
            text-align: center;
            max-width: 450px;
            width: 90%;
            position: relative;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 4rem;
            color: #fff;
            margin-top: 0;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 3px;
            /* Efeito neon rosa no título */
            text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055, 0 0 40px #ff0055, 0 0 80px #ff0055;
            animation: piscar 3s infinite alternate; /* Animação estilo placa de neon */
        }

        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            color: #00ffff; /* Ciano neon */
            margin-top: 0;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #00ffff, 0 0 15px #00ffff;
        }

        p {
            color: #d1d1d1;
            margin-bottom: 40px;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 400;
        }

        /* Estilo do botão insano */
        .botao-confirmar {
            display: inline-block;
            width: 100%;
            padding: 18px;
            background-color: transparent;
            color: #ffffff;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid #00ffff;
            border-radius: 6px;
            box-sizing: border-box;
            box-shadow: 0 0 10px #00ffff, inset 0 0 10px rgba(0, 255, 255, 0.5);
            transition: all 0.3s ease-in-out;
            cursor: pointer;
        }

        .botao-confirmar:hover {
            background-color: #00ffff;
            color: #000000;
            box-shadow: 0 0 25px #00ffff, inset 0 0 15px #00ffff;
            transform: scale(1.05); /* Dá um zoom no botão */
        }

        /* Animação do neon piscando tipo letreiro de balada */
        @keyframes piscar {
            0%, 18%, 22%, 25%, 53%, 57%, 100% {
                text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055, 0 0 40px #ff0055, 0 0 80px #ff0055;
            }
            20%, 24%, 55% {
                text-shadow: none;
                color: #555;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MEUS 18TÃO</h1>
        <h2 class="subtitle">🚨 Projeto X Edition 🚨</h2>
        
        <p>O que acontece nessa festa, morre nessa festa. 🍻🔥 <br><br> Prepare-se para a noite mais épica e insana do ano. Sem regras, sem frescura. <br>Você tem coragem de colar?</p>
        
        <!-- O seu link já está configurado aqui -->
        <a href="https://form.respondi.app/VrL1fo0w" target="_blank" class="botao-confirmar">
            Eu Vou Sobreviver (Confirmar)
        </a>

    </div>

</body>
</html>
